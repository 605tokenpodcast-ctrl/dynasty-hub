name: Build styles.css

# Rebuilds styles.css (Tailwind, from the classes used in index.html) whenever the page changes on
# main, so nobody has to remember `npm run build:css`. Commits only when the CSS actually changed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tailwind.config.js'
      - 'styles/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: build-css
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: npm ci && npm run build:css

      - name: Commit styles.css if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --staged --quiet || (git commit -m "chore: rebuild styles.css [skip ci]" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
