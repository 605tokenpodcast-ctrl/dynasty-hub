name: Deploy Cloudflare Workers

# Deploys the league bot, live score cache and award card workers in workers/.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Optional secrets are copied into the league bot as worker secrets:
# DISCORD_WEBHOOK_URL, GROUPME_BOT_ID, ANTHROPIC_API_KEY, BOT_ADMIN_KEY.
# See workers/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/league-bot/**'
      - 'workers/live-scores/**'
      - 'workers/award-cards/**'
      - '.github/workflows/deploy-workers.yml'

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy. See workers/README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Deploy live score cache
        if: steps.creds.outputs.ok == 'true'
        working-directory: workers/live-scores
        run: npm ci && npx wrangler deploy

      - name: Deploy award cards
        if: steps.creds.outputs.ok == 'true'
        working-directory: workers/award-cards
        run: npm ci && npx wrangler deploy

      - name: Create the league bot's KV namespace (first run only)
        if: steps.creds.outputs.ok == 'true'
        working-directory: workers/league-bot
        run: |
          npm ci
          NS=dynasty-league-bot-kv
          find_id() { npx wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>x.title===process.argv[1]||x.title.endsWith('-'+process.argv[1]));process.stdout.write(n?n.id:'')})" "$NS"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create "$NS"
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create KV namespace $NS"; exit 1; fi
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$ID/" wrangler.toml
          echo "Using KV namespace $ID"

      - name: Deploy league bot
        if: steps.creds.outputs.ok == 'true'
        working-directory: workers/league-bot
        run: npx wrangler deploy

      - name: Copy optional secrets into the league bot
        if: steps.creds.outputs.ok == 'true'
        working-directory: workers/league-bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_KEY: ${{ secrets.BOT_ADMIN_KEY }}
        run: |
          for name in DISCORD_WEBHOOK_URL GROUPME_BOT_ID ANTHROPIC_API_KEY ADMIN_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done
