name: Auto-Sync Dynasty Hub Data

on:
  schedule:
    # Every day at 11:00 AM CDT (16:00 UTC) during the season (September-January)...
    - cron: '0 16 * 9-12,1 *'
    # ...and every Wednesday the rest of the year
    - cron: '0 16 * 2-8 3'
  workflow_dispatch: # Allows manual 1-click execution anytime
    inputs:
      full_refresh:
        description: 'Re-fetch finished Fleaflicker seasons too (normally reused from the file)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the run start the worker deploy when a league renews

concurrency:
  group: dynasty-hub-sync
  cancel-in-progress: false

jobs:
  update-hub-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The branch as it is now, not the commit the run was queued on: a run that waited behind
          # another sync would otherwise start from data that run already replaced, and its push
          # would then fail on a merge conflict
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Each sync guards its own output file and exits non-zero on failure. They keep going so one
      # outage doesn't block the others; the final step turns any failure into a red run.
      - name: Run FantasyCalc Value Sync
        id: values
        continue-on-error: true
        run: python scripts/sync_ktc.py

      - name: Run Sleeper League Data Sync
        id: leagues
        continue-on-error: true
        run: python scripts/sync_leagues.py

      - name: Run Fleaflicker League History Sync
        id: flea
        continue-on-error: true   # a Fleaflicker outage shouldn't block KTC/Sleeper updates
        env:
          FLEA_DEBUG: "0"         # "1" saves raw API samples as a build artifact (see the next step)
          FLEA_FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
        run: python scripts/sync_fleaflicker.py

      # After the league syncs, so trades recorded today are seen; freezes values for trades reaching 3 years
      - name: Freeze dynasty values for trades reaching their 3-year grade
        id: tradevalues
        continue-on-error: true
        run: python scripts/sync_trade_values.py

      - name: Upload Fleaflicker raw API samples (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleaflicker-debug
          path: fleaflicker_debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and Push Changes if Updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ktc_values.json sleeper_leagues_master.json player_meta.json leagues.json trade_values.json
          # leagues.json only changes when a Sleeper league renewed for a new season
          leagues_changed=$(git diff --staged --quiet -- leagues.json || echo yes)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync live sleeper league data and KTC valuations [skip ci]" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
          if [ -n "$leagues_changed" ]; then
            echo "League IDs changed; redeploying the workers with the new IDs"
            gh workflow run deploy-workers.yml --ref "${GITHUB_REF_NAME}"
          fi

      - name: Fail run if a sync step failed
        if: steps.values.outcome == 'failure' || steps.leagues.outcome == 'failure' || steps.flea.outcome == 'failure' || steps.tradevalues.outcome == 'failure'
        run: |
          echo "values sync: ${{ steps.values.outcome }}, leagues sync: ${{ steps.leagues.outcome }}, fleaflicker sync: ${{ steps.flea.outcome }}, trade values: ${{ steps.tradevalues.outcome }}"
          exit 1
