name: Auto-Sync Dynasty Hub Data

on:
  schedule:
    # Runs automatically every Wednesday at 11:00 AM CDT (16:00 UTC)
    - cron: '0 16 * * 3'
  workflow_dispatch: # Allows manual 1-click execution anytime

permissions:
  contents: write

jobs:
  update-hub-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run KTC Value Sync
        run: python scripts/sync_ktc.py

      - name: Run Sleeper League Data Sync
        run: python scripts/sync_leagues.py

      - name: Run Fleaflicker League History Sync
        continue-on-error: true   # a Fleaflicker outage shouldn't block KTC/Sleeper updates
        env:
          FLEA_DEBUG: "1"
        run: python scripts/sync_fleaflicker.py

      - name: Upload Fleaflicker raw API samples (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleaflicker-debug
          path: fleaflicker_debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ktc_values.json sleeper_leagues_master.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync live sleeper league data and KTC valuations [skip ci]" && git push)
